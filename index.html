<title>AI Theme Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#fafafa;--surf:#fff;--surf2:#f5f5f5;--bd:#ebebeb;--tx:#000;--mut:#7e7e7e;--acc:#ff4a01;--accs:#ff4a011f;--pos:#22ba00;--neg:#ff441b}
@media(prefers-color-scheme:dark){:root{--bg:#111;--surf:#1c1c1c;--surf2:#242424;--bd:#2c2c2c;--tx:#fafafa;--mut:#a0a0a0}}
html[data-t=light]{--bg:#fafafa;--surf:#fff;--surf2:#f5f5f5;--bd:#ebebeb;--tx:#000;--mut:#7e7e7e}
html[data-t=dark]{--bg:#111;--surf:#1c1c1c;--surf2:#242424;--bd:#2c2c2c;--tx:#fafafa;--mut:#a0a0a0}
*{box-sizing:border-box}body{font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.nav .in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
.brand{font-weight:600;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.nav a{color:var(--mut);text-decoration:none;font-size:13px;font-weight:500}.nav a:hover{color:var(--tx)}.sp{flex:1}
#tt{background:var(--surf);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:5px 12px;cursor:pointer;font:500 12px Inter,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:40px 24px 60px}
.eyebrow{display:inline-block;font-size:12px;font-weight:500;color:var(--acc);background:var(--accs);border-radius:999px;padding:3px 10px;margin-bottom:12px}
h1{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin:0 0 10px}
h2{font-size:28px;font-weight:600;letter-spacing:-.04em;margin:56px 0 6px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:24px 0 28px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card b{display:block;font-size:14px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
.card span{display:inline-block;font-size:11.5px;font-weight:500;margin:0 4px 4px 0;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.tw{background:var(--surf);border:1px solid var(--bd);border-radius:16px;overflow:auto;max-height:80vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{padding:8px 12px;border-bottom:1px solid var(--bd)}
th{cursor:pointer;text-align:left;background:var(--surf2);position:sticky;top:0;z-index:2;font-weight:500;color:var(--mut);font-size:12px;white-space:nowrap}th:hover{color:var(--acc)}
td.n{text-align:right;font-variant-numeric:tabular-nums;width:80px;font-weight:500}tr.st{cursor:pointer}tr.st:hover td{background-color:var(--surf2)}
tr.tk td{font-size:12px;color:var(--mut);background:var(--surf2)}tr.tk td:first-child{padding-left:30px}
.tag{font-size:10.5px;color:var(--mut);background:var(--surf2);border:1px solid var(--bd);border-radius:999px;padding:1px 7px;margin-left:4px}
.ctl{margin:12px 0;color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button{background:var(--surf);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px Inter,sans-serif}
.ctl button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ctl select,.ctl input{background:var(--surf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font:13px Inter,sans-serif}
.newsig{background:var(--surf);border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:16px;padding:14px 18px;font-size:13px;margin-bottom:12px}.newsig div{margin:3px 0}
.pill{display:inline-block;font-size:11px;font-weight:500;border-radius:999px;padding:1px 8px;margin:1px 2px;white-space:nowrap}.up{background:#22ba0026;color:#1a8f00}.dn{background:#ff441b22;color:#e0300a}.mx{background:var(--surf2);color:var(--mut)}
#sigt td{white-space:nowrap}.foot{font-size:12px;color:var(--mut);margin-top:40px;padding-top:20px;border-top:1px solid var(--bd)}
@media(max-width:640px){h1{font-size:30px}h2{font-size:22px}.wrap{padding:24px 14px}.nav .in{padding:10px 14px;gap:12px}.nav a{display:none}th,td{padding:6px 8px}}
</style></head><body>
