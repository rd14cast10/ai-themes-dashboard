const f=v=>v==null?"n/a":(v>0?"+":"")+(v*100).toFixed(2)+"%";
const cell=(v,p)=>`<td class="n" style="background:${col(v,p)}">${f(v)}</td>`;
document.getElementById("meta").textContent=`Data as of ${D.asof} close (last US session) · generated ${D.generated} · equal-weighted baskets · 1W = 5 trading days, 1M = 21, 3M = 63, YTD from 2025-12-31 close, 1Y = 252`;
document.getElementById("cards").innerHTML=D.themes.map(t=>`<div class="card"><b>${t.theme}</b>${P.map(p=>`<span style="background:${col(t[p],p)}">${p} ${f(t[p])}</span>`).join("")}</div>`).join("")+
 D.bench.map(b=>`<div class="card"><b>${b.ticker} (benchmark)</b>${P.map(p=>`<span style="background:${col(b[p],p)}">${p} ${f(b[p])}</span>`).join("")}</div>`).join("");
function cmp(a,b){let x=a[sortK],y=b[sortK];if(x==null)return 1;if(y==null)return -1;return(typeof x=="string"?x.localeCompare(y):x-y)*dir}
function rows(s){let id=s.theme+"|"+s.name,h=`<tr class="st" data-id="${id}"><td>${open.has(id)?"▾":"▸"} ${s.name} <span class="tag">${s.n}/${s.tickers.length}</span></td><td>${s.theme}</td>${P.map(p=>cell(s[p],p)).join("")}</tr>`;
 if(open.has(id))h+=s.tickers.map(t=>`<tr class="tk"><td>${t.ticker}${t.yahoo&&t.yahoo!==t.ticker?` <span class="tag">${t.yahoo}</span>`:""}${t.price!=null?` <span class="tag">${t.price.toLocaleString(undefined,{maximumFractionDigits:2})}</span>`:""}${t.note?` <span class="tag" title="${t.note.replace(/"/g,"&quot;")}">ⓘ ${t.yahoo?"note":"excluded"}</span>`:""}</td><td></td>${P.map(p=>cell(t[p],p)).join("")}</tr>`).join("");return h}
function render(){let h="";
 if(grouped){D.themes.forEach(t=>{h+=`<tr><td colspan=2><b>${t.theme.toUpperCase()}</b> <span class="tag">theme avg</span></td>${P.map(p=>cell(t[p],p)).join("")}</tr>`;
   [...t.subthemes].sort(cmp).forEach(s=>h+=rows(s))})}
 else [...subs].sort(cmp).forEach(s=>h+=rows(s));
 document.getElementById("tb").innerHTML=h;
 document.querySelectorAll("tr.st").forEach(r=>r.onclick=()=>{let i=r.dataset.id;open.has(i)?open.delete(i):open.add(i);render()})}
document.querySelectorAll("#main th").forEach(th=>th.onclick=()=>{let k=th.dataset.k;if(sortK==k)dir*=-1;else{sortK=k;dir=(k=="name"||k=="theme")?1:-1}render()});
gT.onclick=()=>{grouped=true;gT.className="on";gF.className="";render()};gF.onclick=()=>{grouped=false;gF.className="on";gT.className="";render()};
document.getElementById("foot").innerHTML="<b>Signals:</b> "+D.ta_doc+"<br><b>Method:</b> each subtheme = simple average of its tickers' adjusted-close returns in local currency (Yahoo Finance); theme = average of its subthemes. Non-US closes cut at the same date as the last US session. "+
 (D.unresolved.length?"<br><b>Excluded / unresolved:</b> "+D.unresolved.map(u=>`${u.ticker} (${u.note})`).join("; "):"")+
 (D.nodata.length?"<br><b>No price data:</b> "+D.nodata.map(u=>`${u.ticker}→${u.yahoo}`).join(", "):"");
render();
// ---------- Signals ----------
const SR=[];const seen=new Set();
D.themes.forEach(t=>t.subthemes.forEach(s=>{if(s.ta)SR.push({kind:"basket",name:s.name,theme:t.theme,d1:s["1D"],a:s.ta,spark:s.spark})}));
D.themes.forEach(t=>t.subthemes.forEach(s=>s.tickers.forEach(x=>{if(x.ta&&!seen.has(x.yahoo)){seen.add(x.yahoo);SR.push({kind:"stock",name:x.ticker,theme:t.theme,sub:[s.name],d1:x["1D"],a:x.ta})}else if(x.ta){let r=SR.find(r=>r.kind=="stock"&&r.name==x.ticker);if(r&&!r.sub.includes(s.name))r.sub.push(s.name)}})));
D.bench.forEach(b=>{if(b.ta)SR.push({kind:"bench",name:b.ticker,theme:"Benchmark",d1:b["1D"],a:b.ta})});
SR.forEach(r=>{const a=r.a;r.vs50=a.vs50;r.vs200=a.vs200;r.trend=a.trend;r.rsi=a.rsi;r.macd=a.macd_cross?a.macd_cross+(a.macd_ago?` (${a.macd_ago}d ago)`:" (today)"):"";
 r.cross=a.cross?a.cross+(a.cross_ago?` (${a.cross_ago}d ago)`:" (today)"):"";r.brk=a.brk||"";r.newn=(a.new||[]).length;r.flags=a.flags||[]});
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
const tcls=t=>t=="Uptrend"?"up":t=="Downtrend"?"dn":"mx";
function spark(v){if(!v||v.length<2)return"";const mn=Math.min(...v),mx=Math.max(...v),w=90,h=20;
 const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-(y-mn)/(mx-mn||1)*h).toFixed(1)}`).join(" ");
 return `<svg width="${w}" height="${h}"><polyline fill="none" stroke="${v[v.length-1]>=v[0]?"#4c8":"#e66"}" stroke-width="1.3" points="${pts}"/></svg>`}
const pc=v=>v==null?"n/a":(v>0?"+":"")+(v*100).toFixed(1)+"%";
let sK="newn",sD=-1;
[...new Set(D.themes.map(t=>t.theme))].forEach(t=>fTheme.innerHTML+=`<option>${t}</option>`);
function match(r,f){if(!f)return true;const a=r.a;return f=="New today"?r.newn>0:f=="Uptrend"||f=="Downtrend"||f=="Mixed"?r.trend==f:
 f=="Golden cross"?a.cross=="Golden":f=="Death cross"?a.cross=="Death":f=="RSI overbought"?a.rsi_flag=="Overbought":f=="RSI oversold"?a.rsi_flag=="Oversold":
 f=="MACD bullish"?a.macd_cross=="Bullish":f=="MACD bearish"?a.macd_cross=="Bearish":f=="20D breakout"?a.brk=="Breakout":f=="20D breakdown"?a.brk=="Breakdown":true}
function rsig(){const ty=fType.value,f=fSig.value,th=fTheme.value,q=fQ.value.toLowerCase();
 let rs=SR.filter(r=>(ty=="all"||r.kind==ty||r.kind=="bench")&&match(r,f)&&(!th||r.theme==th)&&(!q||(r.name+" "+(r.sub||[]).join(" ")).toLowerCase().includes(q)));
 rs.sort((x,y)=>{let a=x[sK],b=y[sK];if(a==null||a==="")return 1;if(b==null||b==="")return -1;return(typeof a=="string"?a.localeCompare(b):a-b)*sD});
 sigN.textContent=rs.length+" rows";
 sigb.innerHTML=rs.map(r=>{const a=r.a;return`<tr><td title="${(r.sub||[]).join(", ")}">${r.kind=="basket"?"<b>"+r.name+"</b>":r.name}</td><td>${r.kind}</td><td>${r.theme}</td><td>${r.spark?spark(r.spark):""}</td>
 ${cell(r.d1,"1D")}<td class="n">${pc(r.vs50)}</td><td class="n">${pc(r.vs200)}</td><td>${pill(r.trend,tcls(r.trend))}</td>
 <td class="n" style="color:${a.rsi>70?"#f88":a.rsi<30?"#8cf":"inherit"}">${a.rsi!=null?a.rsi.toFixed(1):"n/a"}</td>
 <td>${a.macd_cross?pill(r.macd,a.macd_cross=="Bullish"?"up":"dn"):""}</td><td>${a.cross?pill(r.cross,a.cross=="Golden"?"up":"dn"):""}</td>
 <td>${a.brk?pill(a.brk,a.brk=="Breakout"?"up":"dn"):""}</td><td>${(a.new||[]).map(n=>pill(n,/bull|break(out)|Golden|>70/.test(n)?"up":"dn")).join("")}</td></tr>`}).join("")}
document.querySelectorAll("#sigt th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sK==k)sD*=-1;else{sK=k;sD=(["name","kind","theme","trend","macd","cross","brk"].includes(k))?1:-1}rsig()});
[fType,fSig,fTheme].forEach(e=>e.onchange=rsig);fQ.oninput=rsig;
(function(){const B=SR.filter(r=>r.kind=="basket"),S=SR.filter(r=>r.kind=="stock"),c=(rs,k)=>rs.filter(r=>r.trend==k).length;
 tacounts.innerHTML=`Baskets: ${pill(c(B,"Uptrend")+" uptrend","up")}${pill(c(B,"Downtrend")+" downtrend","dn")}${pill(c(B,"Mixed")+" mixed","mx")} · Stocks: ${pill(c(S,"Uptrend")+" uptrend","up")}${pill(c(S,"Downtrend")+" downtrend","dn")}${pill(c(S,"Mixed")+" mixed","mx")}${c(S,"n/a")?pill(c(S,"n/a")+" n/a","mx"):""}`;
 const sigs=["Golden cross","Death cross","20D breakout","20D breakdown","RSI >70","RSI <30","MACD bullish cross","MACD bearish cross"];
 let h="<b>New signals today ("+D.asof+")</b>";
 sigs.forEach(k=>{const b=B.filter(r=>(r.a.new||[]).includes(k)),s=S.filter(r=>(r.a.new||[]).includes(k));if(!b.length&&!s.length)return;
  h+=`<div>${pill(k,/bull|breakout|Golden|>70/.test(k)?"up":"dn")} ${b.map(r=>"<b>"+r.name+"</b>").join(", ")}${b.length&&s.length?" · ":""}${s.map(r=>r.name+` <span class="tag">${pc(r.d1)}</span>`).join(" ")}</div>`});
 newsig.innerHTML=h})();
rsig();
</script></body></html>
